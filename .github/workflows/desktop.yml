name: Lumos desktop installers

on:
  # Manual: GitHub → Actions → "Lumos desktop installers" → Run workflow.
  workflow_dispatch:
  # Release: pushing a tag like v0.3.0 builds the installers and publishes them.
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, AppImage)
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - name: Windows (exe, msi)
            os: windows-latest
            args: ""
          - name: macOS (dmg, universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lumos-rs
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev libasound2-dev patchelf cmake libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lumos-rs/ui/package-lock.json
            lumos-rs/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            lumos-rs/desktop/src-tauri

      - name: Build web UI (embedded into the app)
        working-directory: lumos-rs/ui
        run: |
          npm ci
          npm run build

      - name: Install desktop tooling
        working-directory: lumos-rs/desktop
        run: npm ci

      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: lumos-rs/desktop
        run: npx tauri build ${{ matrix.args }}

      - name: Build installers and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: lumos-rs/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Lumos ${{ github.ref_name }}"
          releaseBody: "Instaladores de Lumos para Windows, macOS y Linux."
          releaseDraft: false
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lumos-${{ runner.os }}
          if-no-files-found: error
          path: |
            lumos-rs/desktop/src-tauri/target/release/bundle/deb/*.deb
            lumos-rs/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            lumos-rs/desktop/src-tauri/target/release/bundle/nsis/*.exe
            lumos-rs/desktop/src-tauri/target/release/bundle/msi/*.msi
            lumos-rs/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
